<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nebula</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; background: #0c0d11; color: #f4f5f7; font-family: Outfit, "Segoe UI", sans-serif; }
      main {
        height: 100%; display: grid; place-items: center; text-align: center;
        background: radial-gradient(520px 280px at 50% 42%, rgba(124, 106, 247, 0.28), transparent 70%);
      }
      img { width: 92px; height: 92px; filter: drop-shadow(0 12px 28px rgba(124, 106, 247, 0.45)); }
      strong { display: block; margin-top: 14px; font-size: 22px; letter-spacing: -0.04em; }
      i {
        display: block; width: 96px; height: 3px; margin: 16px auto 0; border-radius: 99px;
        background: rgba(255, 255, 255, 0.08); overflow: hidden; font-style: normal;
      }
      i::after {
        content: ""; display: block; height: 100%; width: 40%; border-radius: inherit;
        background: #9b8cff; animation: slide 1s ease-in-out infinite;
      }
      @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(280%); } }
    </style>
  </head>
  <body>
    <main>
      <div>
        <img src="build/icon.png" alt="" />
        <strong>Nebula</strong>
        <i></i>
      </div>
    </main>
  </body>
</html>
