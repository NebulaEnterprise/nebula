<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nebula</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; background: #0c0d11; color: #f4f5f7; font-family: Outfit, "Segoe UI", sans-serif; }
      main {
        min-height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; padding: 32px;
        background: radial-gradient(520px 240px at 50% 30%, rgba(124, 106, 247, 0.2), transparent 70%);
      }
      img { width: 88px; height: 88px; filter: drop-shadow(0 0 12px rgba(255, 160, 255, 0.9)) drop-shadow(0 0 26px rgba(160, 70, 255, 0.8)); }
      h1 { margin: 16px 0 8px; font-size: 26px; letter-spacing: -0.03em; }
      p { margin: 0 auto; color: #b4b7c2; max-width: 360px; line-height: 1.5; }
      button {
        margin-top: 20px; border: 0; border-radius: 10px; background: #7c6af7; color: white;
        font: inherit; font-weight: 700; padding: 10px 18px; cursor: pointer;
      }
      button:hover { background: #6d5ce8; }
    </style>
  </head>
  <body>
    <main>
      <div>
        <img src="build/icon.png" alt="" />
        <h1>Nebula is offline</h1>
        <p>The app couldn’t reach nebulaspace.lol. Check your connection, then try again.</p>
        <button type="button" onclick="nebulaDesktop.retry()">Retry</button>
      </div>
    </main>
  </body>
</html>
